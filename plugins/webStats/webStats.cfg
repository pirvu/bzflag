# Configuration for the webStats plugin. Load it with:
#   bzfs -loadplugin webStats,/path/to/webStats.cfg
# or, for a quick test with the defaults:
#   bzfs -loadplugin webStats,http://127.0.0.1:8080/api/ingest

[webStats]
  # Where the web service listens (see web/README.md)
  url = http://127.0.0.1:8080/api/ingest

  # Must match INGEST_KEY of the web service. Required when the web
  # service is not on the same machine.
  key =

  # Also append every event as a line of JSON to this file. The web service
  # can import it (node server.js import FILE) if it missed anything.
  file =

  # Name of this server in the web page. Defaults to the public address.
  server =

  # Forward server log lines up to this debug level (-1 disables). IP
  # addresses are masked and private messages dropped, unless sendIP /
  # privateChat below are enabled.
  logLevel = 1

  # Seconds between batches sent to the web service
  flushInterval = 1

  # Send player IP addresses. They are kept out of the join events on the
  # page, but the forwarded log lines would show them.
  sendIP = false

  # Also record private and admin channel messages. They would be visible
  # on the page!
  privateChat = false
